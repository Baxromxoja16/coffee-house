<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="global.css">

    <script src="./src/components/button-secondary/index.js" defer></script>
    <script src="./src/components/button-primary/index.js" defer></script>
    <script src="./src/components/button-social/index.js" defer></script>
    <script src="./src/components/button-burger/index.js" defer></script>
    <script src="./src/components/contact-link/index.js" defer></script>
    <script src="./src/components/menu-link/index.js" defer></script>
    <script src="./src/components/navbar/index.js" defer></script>
    <script src="./src/components/footer/index.js" defer></script>
    <script defer type="module" src="./src/shared/error/index.js"></script>
    <script defer type="module" src="./src/shared/succes/index.js"></script>

    <script type="module" src="./src/pages/cart.js"></script>

    <style>
        .cart-content .cart {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            color: var(--dark);
        }
        .cart-content .cart .cart-left {
            display: flex;
            align-items: center;
            gap: 20px; 
        }
        .cart-content .cart .cart-left .trash {
            cursor: pointer;
        }
        .cart-content .cart .cart-left .cart-info {
            display: flex;
            align-items: center;
            gap: 20px;

        }
        .cart-content .cart .cart-left .cart-info .image {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            width: 100px;
            height: 100px;
            overflow: hidden;
        }
        .cart-content .cart .cart-left .cart-info .info-text .info-title {
            font-size: 24px;
            line-height: 125%;
            margin-bottom: 8px;
        }
        .cart-content .cart .cart-left .cart-info .info-text .info-description {
            font-weight: 400;
            font-size: 16px;
        }
        .cart-content .cart .cart-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 24px;
            line-height: 125%;
        }
        .price-discount {
            text-decoration: line-through;
            opacity: .5;
        }

        .total-price {
            margin-top: 40px;
            padding-left: 44px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .total-price .total-title {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            line-height: 125%;
            color: var(--dark);
        }
        .total-price .all-price {
            display: flex;
            gap: 20px;
        }

        .button {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: auto;
            margin-top: 40px;
            margin-bottom: 100px;
        }
    </style>
    <title>Cart</title>
</head>
<body>
    <app-error id="appError"></app-error>
    <app-success id="appSuccess"></app-success>

    <app-navbar></app-navbar>

    <main>
        <div class="container">
            <h1 class="main-title">Cart</h1>

            <div class="cart-content">
                <div class="cart">
                    <div class="cart-left">
                        <span class="trash">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 9L18.005 20.3463C17.8369 21.3026 17.0062 22 16.0353 22H7.96474C6.99379 22 6.1631 21.3026 5.99496 20.3463L4 9" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M21 6H15.375M3 6H8.625M8.625 6V4C8.625 2.89543 9.52043 2 10.625 2H13.375C14.4796 2 15.375 2.89543 15.375 4V6M8.625 6H15.375" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                                
                        </span>
                        <div class="cart-info">
                            <div class="image">
                                <img src="./images/dessert-img/coffee-1.jpg" alt="" width="100%" >
                            </div>
                            <div class="info-text">
                                <h3 class="info-title">Marble cheesecake</h3>
                                <p class="info-description">50g, Berries, Nuts</p>
                            </div>
                        </div>
                    </div>
                    <div class="cart-right">
                        <div class="price-discount">$3.50</div>
                        <div class="price">$3.00</div>
                    </div>
                </div>
                <div class="cart">
                    <div class="cart-left">
                        <span class="trash">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 9L18.005 20.3463C17.8369 21.3026 17.0062 22 16.0353 22H7.96474C6.99379 22 6.1631 21.3026 5.99496 20.3463L4 9" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M21 6H15.375M3 6H8.625M8.625 6V4C8.625 2.89543 9.52043 2 10.625 2H13.375C14.4796 2 15.375 2.89543 15.375 4V6M8.625 6H15.375" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                                
                        </span>
                        <div class="cart-info">
                            <div class="image">
                                <img src="./images/dessert-img/coffee-1.jpg" alt="" width="100%" >
                            </div>
                            <div class="info-text">
                                <h3 class="info-title">Marble cheesecake</h3>
                                <p class="info-description">50g, Berries, Nuts</p>
                            </div>
                        </div>
                    </div>
                    <div class="cart-right">
                        <div class="price-discount">$3.50</div>
                        <div class="price">$3.00</div>
                    </div>
                </div>
            </div>

            <div class="total-price">
                <p class="total-title">
                    Total:
                    <span class="all-price">
                        <span class="price-discount">$3.50</span>
                        <span class="price">$3.00</span>
                    </span>
                </p>
                <p class="total-title adress">
                    Address:
                    <span class="all-price">
                        <span class="price">City, Street, 7</span>
                    </span>
                </p>
                <p class="total-title pay-by">
                    Pay by:
                    <span class="all-price">
                        <span class="price">Card</span>
                    </span>
                </p>
            </div>


            <div class="button">
                <button-secondary text="Sign In"></button-secondary>
                <button-secondary text="Registration"></button-secondary>
                <!-- <button-secondary text="Confirm"></button-secondary> -->
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>


    
</body>
</html>
