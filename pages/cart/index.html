<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/coffee-house/images/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="/coffee-house/global.css">

    <style>
        .cart-content .cart {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            color: var(--dark);
        }
        .cart-content .cart .cart-left {
            display: flex;
            align-items: center;
            gap: 20px; 
        }
        .cart-content .cart .cart-left .trash {
            cursor: pointer;
        }
        .cart-content .cart .cart-left .cart-info {
            display: flex;
            align-items: center;
            gap: 20px;

        }
        .cart-content .cart .cart-left .cart-info .image {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            width: 100px;
            height: 100px;
            overflow: hidden;
        }
        .cart-content .cart .cart-left .cart-info .info-text .info-title {
            font-size: 24px;
            line-height: 125%;
            margin-bottom: 8px;
        }
        .cart-content .cart .cart-left .cart-info .info-text .info-description {
            font-weight: 400;
            font-size: 16px;
        }
        .cart-content .cart .cart-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 24px;
            line-height: 125%;
        }
        .price-discount {
            text-decoration: line-through;
            opacity: .5;
        }

        .total-price {
            margin-top: 40px;
            padding-left: 44px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .total-price .total-title {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            line-height: 125%;
            color: var(--dark);
        }
        .total-price .all-price {
            display: flex;
            gap: 20px;
        }

        .button {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: auto;
            margin-top: 40px;
            margin-bottom: 100px;
        }
    </style>
    <title>Cart</title>
  <script type="module" crossorigin src="/coffee-house/assets/main-CeXBiXGv.js"></script>
</head>

    <app-error id="appError"></app-error>
    <app-success id="appSuccess"></app-success>

    <app-navbar></app-navbar>

    <main>
        <div class="container">
            <h1 class="main-title">Cart</h1>

            <div class="cart-content">
            </div>

            <div class="total-price">
                <!-- <p class="total-title">
                    Total:

                    </span>
                </p>
                <p class="total-title adress">
                    Address:

                    </span>
                </p>
                <p class="total-title pay-by">
                    Pay by:
                    <span class="all-price">
                        <span class="price">Card</span>
                    </span>
                </p> -->
            </div>


            <div class="button">
                <!-- <button-secondary text="Sign In" id="signin-btn"></button-secondary>
                <button-secondary text="Registration" id="register-btn"></button-secondary> -->
                <!-- <button-secondary text="Confirm"></button-secondary> -->
            </div>
        </div>
    </main>

</body>
</html>
