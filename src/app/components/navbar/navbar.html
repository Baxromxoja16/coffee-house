<div class="container">
    <nav>
        <a routerLink="/" class="image">
            <img src="/images/logo.png" alt="Coffee House Logo" />
        </a>

        <ul class="nav-menu">
            <li class="nav-item">
                <a (click)="scrollToSection('#slider', $event)">Favorite coffee</a>
            </li>
            <li class="nav-item">
                <a (click)="scrollToSection('#friends', $event)">About</a>
            </li>
            <li class="nav-item">
                <a (click)="scrollToSection('#download', $event)">Mobile app</a>
            </li>
            <li class="nav-item">
                <a (click)="scrollToSection('#footer', $event)">Contact us</a>
            </li>
        </ul>

        <div class="menu-buttons">
            <a class="cart-button" routerLink="/cart">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M16.0942 8.36255L17.1455 15.1959C17.3319 16.4074 16.3945 17.5 15.1688 17.5H4.83122C3.60545 17.5 2.66809 16.4074 2.85448 15.1959L3.90576 8.36255C4.05586 7.38689 4.89536 6.66667 5.88251 6.66667H14.1175C15.1046 6.66667 15.9441 7.38689 16.0942 8.36255Z"
                        stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path
                        d="M11.6663 4.16667C11.6663 3.24619 10.9201 2.5 9.99967 2.5C9.0792 2.5 8.33301 3.24619 8.33301 4.16667"
                        stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>{{ cartCount() }}</span>
            </a>
            <a routerLink="/menu" class="menu-link nav-item">
                <div class="menulink-content">
                    <span class="text">Menu</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M14.166 9.76667V11.6667C14.166 14.8883 11.5543 17.5 8.33268 17.5C5.11102 17.5 2.49935 14.8883 2.49935 11.6667V9.76667C2.49935 9.4353 2.76798 9.16667 3.09935 9.16667H13.566C13.8974 9.16667 14.166 9.4353 14.166 9.76667Z"
                            stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M9.99935 7.49996C9.99935 6.66663 10.5946 5.83329 11.7851 5.83329C13.1 5.83329 14.166 4.7673 14.166 3.45234V2.91663"
                            stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M6.66732 7.5V7.08333C6.66732 5.70262 7.78661 4.58333 9.16732 4.58333C10.0878 4.58333 10.834 3.83714 10.834 2.91667V2.5"
                            stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M13.334 9.16663H15.4173C16.5679 9.16663 17.5007 10.0994 17.5007 11.25C17.5007 12.4006 16.5679 13.3333 15.4173 13.3333H14.1673"
                            stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </a>
        </div>

        <button class="burger-button" (click)="toggleBurgerMenu()" [attr.aria-expanded]="isBurgerOpen()"
            aria-label="Toggle menu">
            @if (isBurgerOpen()) {
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M1.34375 1.34314L12.6575 12.6568" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" />
                <path d="M1.34375 12.6568L12.6575 1.34314" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            } @else {
            <svg width="18" height="10" viewBox="0 0 18 10" fill="none">
                <path d="M1 1H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" />
                <path d="M1 9H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            }
        </button>
    </nav>
</div>

<!-- Burger Menu -->
<div class="burger-menu" [class.open]="isBurgerOpen()">
    <ul>
        <li class="burger-nav-item">
            <a (click)="scrollToSection('#slider', $event)">Favorite coffee</a>
        </li>
        <li class="burger-nav-item">
            <a (click)="scrollToSection('#friends', $event)">About</a>
        </li>
        <li class="burger-nav-item">
            <a (click)="scrollToSection('#download', $event)">Mobile app</a>
        </li>
        <li class="burger-nav-item">
            <a (click)="scrollToSection('#footer', $event)">Contact us</a>

            <path
                d="M6.66732 7.5V7.08333C6.66732 5.70262 7.78661 4.58333 9.16732 4.58333C10.0878 4.58333 10.834 3.83714 10.834 2.91667V2.5"
                stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path
                d="M13.334 9.16663H15.4173C16.5679 9.16663 17.5007 10.0994 17.5007 11.25C17.5007 12.4006 16.5679 13.3333 15.4173 13.3333H14.1673"
                stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

        <span class="text">Menu</span>
    </a>
    <a class="cart-button" (click)="navigateToCart()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M16.0942 8.36255L17.1455 15.1959C17.3319 16.4074 16.3945 17.5 15.1688 17.5H4.83122C3.60545 17.5 2.66809 16.4074 2.85448 15.1959L3.90576 8.36255C4.05586 7.38689 4.89536 6.66667 5.88251 6.66667H14.1175C15.1046 6.66667 15.9441 7.38689 16.0942 8.36255Z"
                stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path
                d="M11.6663 4.16667C11.6663 3.24619 10.9201 2.5 9.99967 2.5C9.0792 2.5 8.33301 3.24619 8.33301 4.16667"
                stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>{{ cartCount() }}</span>
    </a>
</div>
