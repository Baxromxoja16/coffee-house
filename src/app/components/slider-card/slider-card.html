<div class="slider-card">
    <div class="slider-image">
        <img id="image" [src]="productData()?.img" [alt]="productData()?.name">
    </div>
    <div class="slider-content">
        <h2 id="content-title" class="title">{{productData()?.name}}</h2>
        <p id="content-text" class="text">{{productData()?.description}}</p>
        <span id="content-price" class="price" [innerHTML]="productData()?.price"></span>
    </div>
</div>
