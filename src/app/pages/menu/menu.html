<header>
    <div class="title">
        <h2 class="main-title">
            Behind each of our cups hides an <span>amazing surprise</span>
        </h2>
    </div>
    <div class="category">
        <app-tab-button>
            <span>Coffee</span>
            <span icon>☕</span>
        </app-tab-button>
        <app-tab-button>
            <span>Tea</span>
            <svg icon>🫖</svg>
        </app-tab-button>
        <app-tab-button>
            <span>Dessert</span>
            <svg icon>🍰</svg>
        </app-tab-button>
    </div>
</header>

<section class="cards">
    <div class="container">
        <div class="cards-content">
            @if(loading) {
                <div class="loader show">
                    <div class="loader-spinner"></div>
                </div>
            }
            @for (item of [1,2,3,4]; track $index) {
                <app-menu-card></app-menu-card>
            }
        </div>
    </div>
</section>
