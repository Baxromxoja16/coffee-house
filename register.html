<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="/global.css">

    <script defer type="module" src="./src/components/footer/index.js"></script>
    <script defer type="module" src="./src/components/navbar/index.js"></script>
    <script defer type="module" src="./src/components/input-field/index.js"></script>
    <script defer  src="./src/components/button-secondary/index.js"></script>

    <script type="module" src="./src/pages/register.js"></script>

    <style>
        .form-field {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
        }
        .button {
            max-width: 200px;
            margin: auto;
        }
    </style>
    <title>Register</title>
</head>
<body>

    <app-navbar></app-navbar>

    <main>
        <div class="container">
            <h1 class="main-title">Registration</h1>

            <form class="form-field">
                <input-field type="text" label="Login"></input-field>
                <input-field type="password" label="Password"></input-field>
                <input-field type="password" label="Confirm Password"></input-field>
                <input-field type="text" label="City"></input-field>
                <input-field type="text" label="Street"></input-field>
                <input-field type="password" label="House number"></input-field>
            </form>

            <div class="button">
                <button-secondary text="Registration"></button-secondary>
            </div>
        </div>
    </main>


    
</body>
</html>
