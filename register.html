<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="global.css">

    <script src="./src/components/tab-button/index.js" defer></script>
    <script src="./src/components/button-secondary/index.js" defer></script>
    <script src="./src/components/button-primary/index.js" defer></script>
    <script src="./src/components/button-app-store/index.js" defer></script>
    <script src="./src/components/button-carousel/index.js" defer></script>
    <script src="./src/components/button-social/index.js" defer></script>
    <script src="./src/components/button-burger/index.js" defer></script>
    <script src="./src/components/contact-link/index.js" defer></script>
    <script src="./src/components/menu-link/index.js" defer></script>
    <script src="./src/components/slider-card/index.js" defer></script>
    <script src="./src/components/coffee-card/index.js" defer></script>
    <script src="./src/components/navbar/index.js" defer></script>
    <script src="./src/components/footer/index.js" defer></script>
    <script src="./src/components/popup/index.js" defer></script>
    <script defer type="module" src="./src/components/input-field/index.js"></script>
    <script defer type="module" src="./src/components/dropdown-field/index.js"></script>
    <script defer type="module" src="./src/components/error/index.js"></script>

    <script type="module" src="./src/pages/register.js"></script>

    <style>
        .form-field {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }
        .button {
            max-width: 200px;
            margin: auto;
            margin-top: 40px;
            margin-bottom: 100px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-field .radio-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-field label {
            font-family: Inter;
            font-weight: 400;
            font-style: Regular;
            font-size: 16px;
            color: var(--dark);
        }
        .input-field .title-label {
            margin-bottom: 9px;
        }
        
        input[type="radio" i] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;

            /* size matches your SVG: 16x16 */
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            box-sizing: border-box;

            /* make shape rounded like the SVG corners (rx 7.5 => circle-ish). We'll use border-radius 8 for full rounding */
            border-radius: 8px;

            /* default (unchecked) look: cream fill + dark border */
            background-color: #E1D4C9; /* fill from your SVG */
            border: 1px solid #665F55; /* stroke from your SVG */

            /* align with label text */
            vertical-align: middle;
            margin: 0 6px 0 0; /* small gap between radio and following label text if you place input before label */
            cursor: pointer;

            /* smooth transition for state changes */
            transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        } 

        input[type="radio" i]:focus,
        input[type="radio" i]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,95,85,0.12); /* subtle focus ring */
        }

        input[type="radio" i]:checked {
            background-color: #665F55; /* dark filled rect from checked SVG */
            border-color: #665F55;

            /* radial-gradient creates the inner cream circle perfectly centered */
            background-image: radial-gradient(circle at 50% 50%, #E1D4C9 0 40%, transparent 47%);
            background-repeat: no-repeat;
            background-size: 100% 97%; /* adjust for inner circle size */
        }
        
    </style>
    <title>Register</title>
</head>
<body>
    <app-error id="appError"></app-error>

    <app-navbar></app-navbar>

    <main>
        <div class="container">
            <h1 class="main-title">Registration</h1>

            <form class="form-field">
                <input-field type="text" name="login" label="Login"></input-field>
                <input-field type="password" name="password" label="Password"></input-field>
                <input-field type="password" name="confirmPassword" label="Confirm Password"></input-field>
                <dropdown-field name="city" label="City" options='["New York","Los Angeles","Chicago"]'></dropdown-field>

                <dropdown-field type="text" name="street" label="Street" options='["Ulugbek","Kocha","Chicago"]'></dropdown-field>
                <input-field type="number" name="houseNumber" label="House number"></input-field>
                <div class="input-field">
                    <label class="title-label">Pay by</label>
                    <div class="radio-container">
                        <input type="radio" id="cash" value="cash" name="paymentMethod">
                        <label for="cash">Cash</label>
                        <input type="radio" id="card" value="card" name="paymentMethod">
                        <label for="card">Card</label>
                    </div>
                </div>
            </form>

            <div class="button">
                <button-secondary text="Registration"></button-secondary>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>


    
</body>
</html>
